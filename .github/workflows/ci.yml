name: Verificar Xisverso
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  simulation-and-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm.cmd ci
      - run: npm.cmd test
      - run: npm.cmd run build
      - run: npm.cmd run test:e2e
      - run: npm.cmd run check:pages
